<div class="login-wrapper">
  <div class="login-card">

    <div class="login-header">
      <span class="login-logo">🎮</span>
      <h1>GameZone</h1>
      <p>Inicia sesión para continuar</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form" novalidate>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="tu@correo.com"
          [class.input-error]="email?.invalid && email?.touched"
        />
        <div class="error-msg" *ngIf="email?.touched && email?.hasError('required')">
          El correo es obligatorio.
        </div>
        <div class="error-msg" *ngIf="email?.touched && email?.hasError('email')">
          Formato de correo inválido.
        </div>
      </div>

      <!-- Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="Mínimo 6 caracteres"
          [class.input-error]="password?.invalid && password?.touched"
        />
        <div class="error-msg" *ngIf="password?.touched && password?.hasError('required')">
          La contraseña es obligatoria.
        </div>
        <div class="error-msg" *ngIf="password?.touched && password?.hasError('minlength')">
          La contraseña debe tener mínimo 6 caracteres.
        </div>
      </div>

      <!-- Error de credenciales -->
      <div class="error-credentials" *ngIf="errorMessage">
        ⚠️ {{ errorMessage }}
      </div>

      <button type="submit" class="btn-login">Iniciar Sesión</button>

    </form>

    <div class="login-hint">
      <p>Credenciales de prueba:</p>
      <p><strong>admin&#64;miapp.com</strong> / <strong>123456</strong></p>
    </div>

  </div>
</div>
