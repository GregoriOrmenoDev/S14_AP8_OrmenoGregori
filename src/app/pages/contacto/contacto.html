<section class="contacto-page">
  <h2>📬 Contacto</h2>
  <p class="subtitulo">¿Tienes alguna pregunta o sugerencia? Estamos aquí para ayudarte.</p>

  <div class="contacto-grid">

    <div class="contacto-info">
      <h3>Información de contacto</h3>

      <div class="info-item">
        <span class="info-icon">📧</span>
        <div>
          <strong>Email</strong>
          <p>soporte&#64;gamezone.com</p>
        </div>
      </div>

      <div class="info-item">
        <span class="info-icon">💬</span>
        <div>
          <strong>Discord</strong>
          <p>discord.gg/gamezone</p>
        </div>
      </div>

      <div class="info-item">
        <span class="info-icon">🐦</span>
        <div>
          <strong>Twitter / X</strong>
          <p>&#64;GameZoneOficial</p>
        </div>
      </div>

      <div class="info-item">
        <span class="info-icon">📍</span>
        <div>
          <strong>Sede</strong>
          <p>Ciudad de México, México</p>
        </div>
      </div>
    </div>

    <form class="contacto-form">
      <h3>Envíanos un mensaje</h3>

      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" placeholder="Tu nombre" />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="tu@email.com" />
      </div>

      <div class="form-group">
        <label for="asunto">Asunto</label>
        <input type="text" id="asunto" placeholder="¿En qué podemos ayudarte?" />
      </div>

      <div class="form-group">
        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..."></textarea>
      </div>

      <button type="submit" class="btn-enviar">Enviar mensaje 🚀</button>
    </form>

  </div>
</section>
